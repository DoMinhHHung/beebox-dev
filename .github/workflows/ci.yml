name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beebox-project

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beebox
          POSTGRES_PASSWORD: beebox
          POSTGRES_DB: beebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beebox -d beebox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://beebox:beebox@localhost:5432/beebox_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: beebox-project/go.mod
          cache-dependency-path: beebox-project/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race -timeout 5m

      - name: Build server
        run: go build -o /tmp/beebox-server ./cmd/server

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beebox-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: beebox-project/go.mod
          cache-dependency-path: beebox-project/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: beebox-project
          args: --timeout=5m
