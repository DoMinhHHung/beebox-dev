name: Integration

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  beebox-project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: services/beebox-project/go.sum

      - name: integration tests
        working-directory: services/beebox-project
        env:
          BEEBOX_PROJECT_TEST_DATABASE_URL: ${{ secrets.BEEBOX_PROJECT_TEST_DATABASE_URL }}
        run: go test -tags=integration -race -count=1 ./internal/infrastructure/postgres/...