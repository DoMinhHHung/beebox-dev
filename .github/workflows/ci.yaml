name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "beebox/**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: find
        shell: bash
        run: |
          set -euo pipefail

          MODULES="$({
            find . \
              -name go.mod \
              -type f \
              -not -path './.git/*' \
              -exec dirname {} \;
          } | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          if [ "$MODULES" = "[]" ]; then
            echo "No Go modules found"
            exit 1
          fi

          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt check
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go mod verify
        working-directory: ${{ matrix.module }}
        run: go mod verify

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: go test race
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

  beebox-identity-integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/beebox-identity

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: services/beebox-identity/go.sum

      - name: apply migrations
        env:
          DATABASE_URL: postgres://identity:identity@localhost:5432/identity_test?sslmode=disable
        run: go run ./cmd/migrate

      - name: integration tests
        env:
          BEEBOX_IDENTITY_TEST_DATABASE_URL: postgres://identity:identity@localhost:5432/identity_test?sslmode=disable
        run: go test -tags=integration -count=1 ./internal/infrastructure/postgres/
