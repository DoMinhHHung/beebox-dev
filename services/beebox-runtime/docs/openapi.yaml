openapi: 3.1.0
info:
  title: BeeBox Runtime API
  version: 1.0.0
servers:
  - url: /
tags:
  - name: Health
  - name: Project
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/p/{project_id}/auth/session:
    get:
      operationId: getProjectAuthSession
      tags:
        - Project
      summary: Resolve end-user session for a project
      description: |
        Requires a valid project public credential (X-BeeBox-Project-Credential)
        and an end-user Identity bearer token (Authorization).
        Inactive/suspended projects cause project credential verification to fail
        with 401 UNAUTHENTICATED (project status is not disclosed).
        Missing/invalid/revoked/expired user sessions return 401.
        Missing applied session capability returns 403.
        session_id in the response is the Identity-persisted session identifier
        (hash of the bearer), not the raw bearer token.
        organization_id is the MVP placeholder from Identity (equal to user_id).
      security:
        - ProjectCredentialHeader: []
          RuntimeUserSessionBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Project-authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSessionResponse'
        '401':
          description: |
            Unauthenticated. Returned for missing/invalid project credential,
            credential scoped to a different project, inactive/suspended project,
            missing/malformed/invalid/revoked/expired end-user bearer, or
            Identity dependency authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            Forbidden. Returned when the project is active and credential is valid
            but the applied configuration does not enable the required session
            capability, or other authorization gates fail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/DependencyFailureError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/p/{project_id}/_ready:
    get:
      operationId: getProjectReady
      tags:
        - Project
      security:
        - ProjectCredentialHeader: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Project ready snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectReadyResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/DependencyFailureError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ProjectCredentialHeader:
      type: apiKey
      in: header
      name: X-BeeBox-Project-Credential
    RuntimeUserSessionBearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
  responses:
    UnauthenticatedError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DependencyFailureError:
      description: Downstream dependency failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ProjectSessionResponse:
      type: object
      required:
        - project_id
        - user_id
        - session_id
      properties:
        project_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
          description: |
            Identity-persisted session identifier (SHA-256 of the end-user bearer).
            Never equal to the raw Authorization bearer token.
        organization_id:
          type: string
          description: |
            MVP placeholder from Identity; currently equal to user_id.
            Not a real multi-tenant organization identifier.
    ProjectReadyResponse:
      type: object
      required:
        - project_id
        - credential_id
        - applied_version
        - module_id
        - capability_id
      properties:
        project_id:
          type: string
        credential_id:
          type: string
        applied_version:
          type: integer
        module_id:
          type: string
        capability_id:
          type: string
